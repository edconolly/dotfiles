<!--
  Shared page frame for every design-system proposal (me-design-system skill).
  Same layout and behaviour in every proposal, so a reader can compare them section by section:
  sticky top bar, a sticky section list on the left, content on the right; a sideways tab row under 860 px.

  How to use:
  1. Paste the <style> block into the proposal's CSS and map the six --frame-* variables to the proposal's
     own semantic tokens (examples on the right). Don't hard-code colours.
  2. Paste the markup, replacing {{…}}. Put the proposal's title block (and any full-width brand masthead)
     either between the top bar and .doc-frame, or at the top of <main>.
  3. Give each section the matching id, e.g. <section id="principles">. Paste the <script> before </body>.
  Reserved class names: topbar, doc-frame, toc. Don't use them for anything else (a clash hid the list once).
-->
<style>
:root {
  --frame-surface: var(--color-surface-raised, #fff);      /* top bar background */
  --frame-text: var(--color-text-default, #1d1d1f);        /* current item, brand name */
  --frame-text-muted: var(--color-text-muted, #5b5b60);    /* other items, proposal label (≥4.5:1) */
  --frame-line: var(--color-border-subtle, #d6d6db);       /* list rail, bar border */
  --frame-line-strong: var(--color-border-strong, #6b6b70);/* hover rail (≥3:1) */
  --frame-font: inherit;                                   /* the proposal's UI face */
}
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
  padding: 8px 20px; background: var(--frame-surface); border-bottom: 1px solid var(--frame-line); font-family: var(--frame-font); }
.topbar .lockup { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--frame-text); text-decoration: none; }
.topbar .lockup svg { width: 20px; height: 20px; }
.topbar .doc-label { color: var(--frame-text-muted); }
.doc-frame { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 32px;
  max-width: calc(1240px + 200px + 32px); margin: 0 auto; padding: 0 24px; }
.doc-frame > main { min-width: 0; }
.toc { position: sticky; top: 64px; align-self: start; padding-top: 24px; font-family: var(--frame-font); }
.toc ol { list-style: none; margin: 0; padding: 0; }
.toc a { display: flex; align-items: center; min-height: 32px; padding: 0 8px; text-decoration: none;
  border-left: 2px solid var(--frame-line); color: var(--frame-text-muted); }
.toc a:hover { color: var(--frame-text); border-left-color: var(--frame-line-strong); }
.toc a[aria-current="true"] { color: var(--frame-text); border-left-color: var(--frame-text); font-weight: 600; }
main > section[id] { scroll-margin-top: 64px; }
@media (max-width: 860px) {
  .doc-frame { grid-template-columns: minmax(0, 1fr); gap: 0; padding: 0 16px; }
  .toc { position: static; padding-top: 16px; }
  .toc ol { display: flex; overflow-x: auto; gap: 4px; }
  .toc a { border-left: 0; border-bottom: 2px solid var(--frame-line); white-space: nowrap; }
  .toc a[aria-current="true"] { border-bottom-color: var(--frame-text); }
}
</style>

<header class="topbar">
  <a class="lockup" href="#thesis"><svg aria-hidden="true"><use href="#brand-mark"/></svg><span>{{Brand name}}</span></a>
  <span class="doc-label">Design system, proposal {{X}}: {{Name}}</span>
</header>

<div class="doc-frame">
  <nav class="toc" aria-label="Sections">
    <ol>
      <li><a href="#thesis">Thesis</a></li>
      <li><a href="#principles">Principles</a></li>
      <li><a href="#voice">Voice and words</a></li>
      <li><a href="#foundations">Foundations and tokens</a></li>
      <li><a href="#components">Components</a></li>
      <li><a href="#dataviz">Data visualisation</a></li>
      <li><a href="#composites">Composites</a></li>
      <li><a href="#governance">Governance</a></li>
    </ol>
  </nav>
  <main>
    <!-- <section id="thesis">…</section> … <section id="governance">…</section> -->
  </main>
</div>

<script>
/* Marks the section in view in the left list. */
(() => {
  const links = [...document.querySelectorAll('.toc a')];
  if (!('IntersectionObserver' in window)) return;
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) links.forEach(a => a.setAttribute('aria-current', a.hash === '#' + e.target.id));
  }), { rootMargin: '-40% 0px -55% 0px' });
  document.querySelectorAll('main > section[id]').forEach(s => io.observe(s));
})();
</script>
